<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .input-container {
            display: flex;
            gap: 20px;
            margin: 20px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 60px;
            margin-top: 5px;
            padding: 5px;
        }

        button {
            padding: 10px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #radar {
            background-color: #f8f9fa;
        }

        .axis-line {
            stroke: #ddd;
            stroke-width: 1;
        }

        .dimension-label {
            font-size: 12px;
            fill: #333;
            font-weight: bold;
        }

        .data-polygon {
            transform-origin: center;
            animation: scaleIn 0.8s ease-out forwards;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-container">
            <div class="input-group">
                <label>维度 1</label>
                <input type="number" id="data1" min="0" max="100" value="50">
            </div>
            <div class="input-group">
                <label>维度 2</label>
                <input type="number" id="data2" min="0" max="100" value="80">
            </div>
            <div class="input-group">
                <label>维度 3</label>
                <input type="number" id="data3" min="0" max="100" value="70">
            </div>
            <div class="input-group">
                <label>维度 4</label>
                <input type="number" id="data4" min="0" max="100" value="60">
            </div>
            <div class="input-group">
                <label>维度 5</label>
                <input type="number" id="data5" min="0" max="100" value="90">
            </div>
            <div class="input-group">
                <label>维度 6</label>
                <input type="number" id="data6" min="0" max="100" value="40">
            </div>
        </div>
        <button onclick="drawRadar()">生成雷达图</button>
        <svg width="300" height="300" id="radar"></svg>
    </div>

    <script>
        function drawRadar() {
            // 获取输入值
            const values = [];
            for (let i = 1; i <= 6; i++) {
                const value = parseInt(document.getElementById(`data${i}`).value);
                if (isNaN(value) || value < 0 || value > 100) {
                    alert('请输入0-100之间的有效数字');
                    return;
                }
                values.push(value);
            }

            // 清空SVG
            const svg = document.getElementById('radar');
            svg.innerHTML = '';

            // 配置参数
            const centerX = 150;
            const centerY = 150;
            const maxRadius = 100;
            const labelOffset = 20;

            // 绘制背景六边形
            const bgPoints = [];
            for (let i = 0; i < 6; i++) {
                const angle = (-90 + i * 60) * Math.PI / 180;
                const x = centerX + maxRadius * Math.cos(angle);
                const y = centerY + maxRadius * Math.sin(angle);
                bgPoints.push(`${x},${y}`);
            }
            
            const bgHexagon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            bgHexagon.setAttribute('points', bgPoints.join(' '));
            bgHexagon.setAttribute('fill', 'none');
            bgHexagon.setAttribute('stroke', '#ddd');
            bgHexagon.setAttribute('stroke-width', '2');
            svg.appendChild(bgHexagon);

            // 绘制轴线
            for (let i = 0; i < 6; i++) {
                const angle = (-90 + i * 60) * Math.PI / 180;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', centerX);
                line.setAttribute('y1', centerY);
                line.setAttribute('x2', centerX + maxRadius * Math.cos(angle));
                line.setAttribute('y2', centerY + maxRadius * Math.sin(angle));
                line.setAttribute('class', 'axis-line');
                svg.appendChild(line);
            }

            // 绘制维度标签
            for (let i = 0; i < 6; i++) {
                const angle = (-90 + i * 60) * Math.PI / 180;
                const x = centerX + (maxRadius + labelOffset) * Math.cos(angle);
                const y = centerY + (maxRadius + labelOffset) * Math.sin(angle);
                
                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('x', x);
                label.setAttribute('y', y);
                label.setAttribute('text-anchor', 'middle');
                label.setAttribute('dominant-baseline', 'middle');
                label.setAttribute('class', 'dimension-label');
                label.textContent = `维度 ${i+1}`;
                svg.appendChild(label);
            }

            // 计算数据点坐标
            const dataPoints = [];
            for (let i = 0; i < 6; i++) {
                const angle = (-90 + i * 60) * Math.PI / 180;
                const radius = (values[i] / 100) * maxRadius;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                dataPoints.push(`${x},${y}`);
            }

            // 绘制数据多边形
            const dataPolygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            dataPolygon.setAttribute('points', dataPoints.join(' '));
            dataPolygon.setAttribute('fill', 'rgba(0, 120, 255, 0.3)');
            dataPolygon.setAttribute('stroke', 'blue');
            dataPolygon.setAttribute('stroke-width', '2');
            dataPolygon.setAttribute('class', 'data-polygon');
            svg.appendChild(dataPolygon);
        }

        // 初始绘制
        drawRadar();
    </script>
</body>
</html>
